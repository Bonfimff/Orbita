<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KERNEL – Login</title>
  <link rel="stylesheet" href="CSS/login.css" />
  <link rel="icon" href="IMG/Icone.png" type="image/png">
</head>
<body class="login-page">
  <div class="login-container">
    <img src="IMG/Logo.png" alt="KERNEL" class="logo">
    <form id="login-form" class="login-form">
      <input type="text" id="username" placeholder="Usuário" required autofocus>
      <div class="password-wrapper">
        <input type="password" id="password" placeholder="Senha" required>
        <span id="toggle-password" title="Mostrar/ocultar senha">&#128065;</span>
      </div>
      <button type="submit">Entrar</button>
      <div class="login-error" id="login-error">Usuário ou senha inválidos.</div>
    </form>
  </div>
  <script src="SCRIPT/config.js"></script>
  <script src="SCRIPT/login.js"></script>
  
</body>
</html>
