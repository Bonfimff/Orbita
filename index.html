<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KERNEL | Login</title>
  <link rel="stylesheet" href="CSS/login.css?v=4" />
  <link rel="icon" href="IMG/Icone.png" type="image/png">
</head>
<body class="login-page">
  <div class="login-container">
    <div class="logo logo-liquido" id="logo-login" role="img" aria-label="KERNEL"></div>
    <form id="login-form" class="login-form">
      <input type="text" id="username" placeholder="Usuário" required autofocus>
      <div class="password-wrapper">
        <input type="password" id="password" placeholder="Senha" required>
        <button type="button" id="toggle-password" class="toggle-senha" aria-label="Mostrar senha" title="Mostrar senha"><svg class="olho-aberto" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><svg class="olho-fechado" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.2M6.6 6.6C3.9 8.4 2 12 2 12s3.6 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg></button>
      </div>
      <button type="submit">Entrar</button>
      <div class="login-error" id="login-error">Usuário ou senha inválidos.</div>
    </form>
  </div>
  <script src="SCRIPT/config.js"></script>
  <script src="SCRIPT/logo-liquido.js?v=2"></script>
  <script src="SCRIPT/login.js?v=4"></script>
  
</body>
</html>
