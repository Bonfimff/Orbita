<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../CSS/geral.css?v=66" />
  <link rel="stylesheet" href="../CSS/jornada.css?v=9" />
  <link rel="stylesheet" href="../CSS/ajuda.css?v=4" />
  <link rel="icon" href="../IMG/Icone.png" type="image/png">
  <title>Ponto</title>
</head>
<body>

  <!-- Menu lateral -->
  <div class="menu">
    <button class="tab-btn active" data-tab="meu-painel" data-nav-label="Meu Ponto" data-nav-icone="painel">Meu Ponto</button>
    <div class="menu-bottom">
      <button class="menu-icon-btn" id="btn-config">
        <img src="../IMG/configuracoes.png" alt="Configurações">
      </button>
      <button class="menu-icon-btn" id="btn-info">
        <img src="../IMG/info.png" alt="Informações">
      </button>
      <button class="menu-icon-btn" id="btn-logout">
        <img src="../IMG/sair.png" alt="Sair">
      </button>
    </div>
  </div>

  <!-- Barra superior -->
  <div class="top-bar">
    <div class="top-bar-left">
      <img src="../IMG/Logoescura.png" alt="KERNEL" class="top-bar-logo">
      <span class="account-info">
        <img src="../IMG/user-icon.png" alt="Usuário" class="user-icon">
        <span id="logged-user"></span>
        <span id="modulo-ativo">Ponto</span>
      </span>
    </div>
    <div class="top-bar-right">
      <button class="top-tab" id="ordens-tab">Ordens de Serviço</button>
      <button class="top-tab" id="almoxarifado-tab">Estoque</button>
      <button class="top-tab" id="frota-tab">Frota</button>
      <button class="top-tab active" id="jornada-tab">Ponto</button>
      <button class="top-tab" id="gestao-tab">Gestão</button>
    </div>
  </div>

  <!-- Conteúdo principal -->
  <div class="content">

    <!-- ===== ABA: MEU PAINEL ===== -->
    <div id="meu-painel" class="tab-content active">
      <h2 class="aba-legenda">Meu Ponto</h2>
      <hr class="aba-linha">

      <div class="jor-grade">
        <section id="jor-status-card" class="jor-cartao jor-status-card jor-status-fora">
          <div class="jor-status-topo">
            <span class="jor-estado"><span class="jor-estado-ponto"></span><span id="jor-status-texto">Fora do expediente</span></span>
            <button type="button" id="jor-btn-calendario" class="jor-btn-contorno">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
              Ver calendário
            </button>
          </div>
          <div class="jor-status-tempo" id="jor-status-tempo">--:--:--</div>
          <div class="jor-status-detalhe" id="jor-status-detalhe">Nenhum registro em andamento.</div>

          <div class="jor-acoes">
            <button id="jor-btn-iniciar" class="jor-btn jor-btn-principal">Registrar entrada</button>
            <button id="jor-btn-pausar" class="jor-btn jor-btn-secundario" style="display:none">Iniciar intervalo</button>
            <button id="jor-btn-retomar" class="jor-btn jor-btn-principal" style="display:none">Voltar do intervalo</button>
            <button id="jor-btn-finalizar" class="jor-btn jor-btn-perigo" style="display:none">Registrar saída</button>
          </div>
          <div id="jor-mensagem" class="jor-mensagem"></div>
        </section>

        <section class="jor-cartao jor-hoje">
          <h3 class="jor-cartao-titulo">Hoje</h3>
          <div id="jor-hoje-data" class="jor-hoje-data"></div>
          <div id="jor-hoje-escala" class="jor-hoje-linha"></div>
          <div id="jor-hoje-feriado" class="jor-hoje-linha"></div>
          <div id="jor-proximo-feriado" class="jor-hoje-linha jor-suave"></div>
        </section>
      </div>

      <h3 class="jor-subtitulo">Meus registros recentes</h3>
      <div class="tabela-responsiva">
        <table class="estilo-tabela jor-tabela" id="jor-tabela-historico">
          <thead>
            <tr>
              <th>Entrada</th>
              <th>Saída</th>
              <th>Duração</th>
              <th>Status</th>
              <th>Observação</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- Painel lateral direito (logo e clima, igual às outras páginas) -->
  <div class="sidebar-right">
    <img src="../IMG/Logo.png" alt="Logo" class="logo">
    <hr class="logo-divider">
    <div id="sidebar-content"></div>
  </div>

  <script src="../SCRIPT/config.js"></script>
  <script src="../SCRIPT/logo-liquido.js?v=2"></script>
  <script src="../SCRIPT/geral.js?v=42"></script>
  <script src="../SCRIPT/ficha-registro.js?v=1"></script>
  <script src="../SCRIPT/navegacao-subabas.js?v=1"></script>
  <script src="../SCRIPT/gestao-nav.js?v=13"></script>
  <script src="../SCRIPT/configuracoes.js?v=7"></script>
  <script src="../SCRIPT/protecao-print.js?v=3"></script>
  <script src="../SCRIPT/clima-ferro.js?v=14"></script>
  <script src="../SCRIPT/clima-painel.js?v=8"></script>
  <script src="../SCRIPT/ajuda/central.js?v=33"></script>
  <script src="../SCRIPT/jornada.js?v=10"></script>

  <!-- Calendário: escala e feriados -->
  <div id="jor-cal" class="jor-cal-fundo" hidden>
    <div class="jor-cal" role="dialog" aria-modal="true" aria-labelledby="jor-cal-mes">
      <div class="jor-cal-topo">
        <button type="button" class="jor-cal-nav" id="jor-cal-ant" aria-label="Mês anterior">&#8249;</button>
        <h3 id="jor-cal-mes"></h3>
        <button type="button" class="jor-cal-nav" id="jor-cal-prox" aria-label="Próximo mês">&#8250;</button>
        <button type="button" class="jor-cal-fechar" id="jor-cal-fechar" aria-label="Fechar">&times;</button>
      </div>
      <div class="jor-cal-semana"><span>D</span><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span></div>
      <div class="jor-cal-dias" id="jor-cal-dias"></div>
      <div class="jor-cal-legenda">
        <span><i class="lg-escala"></i>Trabalho</span>
        <span><i class="lg-folga"></i>Folga</span>
        <span><i class="lg-feriado"></i>Feriado</span>
        <span><i class="lg-banco"></i>Banco de horas</span>
        <span><i class="lg-justificado"></i>Justificado</span>
        <span><i class="lg-ferias"></i>Férias</span>
        <span><i class="lg-hoje"></i>Hoje</span>
      </div>
      <div class="jor-cal-info" id="jor-cal-info"></div>
      <ul class="jor-cal-lista" id="jor-cal-lista"></ul>
    </div>
  </div>

  <!-- Painel notificação -->
  <div id="info-modal" class="modal" style="display: none;">
    <div class="modal-content">
      <p>Versão de desenvolvimento: 1.0.0</p>
      <button id="modal-ok-btn">OK</button>
    </div>
  </div>
</body>
</html>
