<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../CSS/geral.css?v=12" />
  <link rel="stylesheet" href="../CSS/relatorios.css?v=9" />
  <link rel="stylesheet" href="../CSS/cadastros.css?v=2" />
  <link rel="stylesheet" href="../CSS/gestao-nav.css?v=3" />
  <link rel="stylesheet" href="../CSS/ajuda.css?v=1" />
  <link rel="icon" href="../IMG/Icone.png" type="image/png">
  <title>Cadastros</title>
</head>
<body>

  <!-- Menu lateral -->
  <div class="menu">
    <!-- Abas internas: a partir de tablet/desktop viram pilulas abaixo da
         legenda (ver .menu-subtabs no CSS e montarSubnavDesktop em
         gestao-nav.js) - o menu fica só com as áreas de Gestão. -->
    <div class="menu-subtabs">
      <button class="tab-btn active" data-tab="analise-operacional" data-nav-label="Parâmetros" data-nav-icone="cadastros">Cadastro de Parâmetros</button>
      <button class="tab-btn" data-tab="ativos" data-nav-label="Ativos" data-nav-icone="veiculo">Equipamentos</button>
      <button class="tab-btn" data-tab="locais" data-nav-label="Locais" data-nav-icone="mapa">Bases de Atendimento</button>
    </div>
    <div class="menu-bottom">
      <button class="menu-icon-btn" id="btn-config">
        <img src="../IMG/configuracoes.png" alt="Configurações">
      </button>
      <button class="menu-icon-btn" id="btn-info">
        <img src="../IMG/info.png" alt="Informações">
      </button>
      <button class="menu-icon-btn" id="btn-logout">
        <img src="../IMG/sair.png" alt="Sair">
      </button>
    </div>
  </div>

  <!-- Barra superior -->
  <div class="top-bar">
    <div class="top-bar-left">
      <img src="../IMG/Logoescura.png" alt="KERNEL" class="top-bar-logo">
      <span class="account-info">
        <img src="../IMG/user-icon.png" alt="Usuário" class="user-icon">
        <span id="logged-user"></span>
        <span id="modulo-ativo">Gestão</span>
      </span>
    </div>
    <div class="top-bar-right">
      <button class="top-tab" id="almoxarifado-tab">Estoque</button>
      <button class="top-tab" id="frota-tab">Frota</button>
      <button class="top-tab" id="ordens-tab">Ordens de Serviço</button>
      <button class="top-tab active" id="gestao-tab">Gestão</button>
    </div>
  </div>

  <div class="content">

    <!-- ===== ABA: CADASTRO DE PARÂMETROS ===== -->
    <div id="analise-operacional" class="tab-content active" data-secao="Cadastro de Parâmetros">
      <h2 class="aba-legenda">Cadastro de Parâmetros</h2>
      <hr class="aba-linha">

      <select class="cad-subabas-select" id="cad-subabas">
        <option value="categorias">Categorias</option>
        <option value="problemas">Problemas</option>
        <option value="causas">Causas</option>
        <option value="solucoes">Soluções</option>
        <option value="resultados">Resultados</option>
        <option value="tipos-equipamento">Tipos de equipamento</option>
      </select>

      <div class="cad-cabecalho">
        <div class="cad-busca">
          <input type="search" id="cad-busca" placeholder="Pesquisar..." autocomplete="off">
        </div>
        <label class="cad-check-inline">
          <input type="checkbox" id="cad-incluir-inativos"> Mostrar inativos
        </label>
        <select id="cad-filtro-categoria" class="cad-filtro" hidden>
          <option value="">Todas as categorias</option>
        </select>
        <button type="button" class="rel-btn rel-btn-primario" id="cad-novo">+ Novo</button>
      </div>

      <div class="rel-feedback" id="cad-feedback" hidden></div>
      <div class="rel-tabela-area" id="cad-tabela"></div>
    </div>

    <!-- ===== ABA: EQUIPAMENTOS ===== -->
    <div id="ativos" class="tab-content" data-secao="Equipamentos">
      <h2 class="aba-legenda">Equipamentos</h2>
      <hr class="aba-linha">

      <p class="rel-ajuda rel-ajuda-bloco">
        Equipamento nunca é obrigatório numa O.S. Cadastre apenas os ativos que
        a operação realmente identifica em campo.
      </p>

      <div class="cad-cabecalho">
        <div class="cad-busca">
          <input type="search" id="eq-busca" placeholder="Código, nome, série ou patrimônio..." autocomplete="off">
        </div>
        <select id="eq-filtro-tipo" class="cad-filtro"><option value="">Todos os tipos</option></select>
        <select id="eq-filtro-ponto" class="cad-filtro"><option value="">Todos os pontos</option></select>
        <label class="cad-check-inline">
          <input type="checkbox" id="eq-incluir-inativos"> Mostrar inativos
        </label>
        <button type="button" class="rel-btn rel-btn-primario" id="eq-novo">+ Novo equipamento</button>
      </div>

      <div class="rel-feedback" id="eq-feedback" hidden></div>
      <div class="rel-tabela-area" id="eq-tabela"></div>
    </div>

    <!-- ===== ABA: PONTOS E REGIÕES ===== -->
    <div id="locais" class="tab-content" data-secao="Bases de Atendimento">
      <h2 class="aba-legenda">Bases de Atendimento</h2>
      <hr class="aba-linha">

      <div class="opcoes-abas cad-subabas" id="loc-subabas">
        <button type="button" class="top-tab2 ativo" data-loc="pontos">Bases de Atendimento</button>
        <button type="button" class="top-tab2" data-loc="regioes">Regiões</button>
      </div>

      <div class="cad-cabecalho">
        <div class="cad-busca">
          <input type="search" id="loc-busca" placeholder="Pesquisar..." autocomplete="off">
        </div>
        <button type="button" class="rel-btn rel-btn-primario" id="loc-novo">+ Novo</button>
      </div>

      <div class="rel-feedback" id="loc-feedback" hidden></div>
      <div class="rel-tabela-area" id="loc-tabela"></div>
    </div>

    <!-- ===== ABA: AUDITORIA ===== -->
  </div>

  <!-- Sidebar direita -->
  <div class="sidebar-right">
    <img src="../IMG/Logo.png" alt="Logo" class="logo">
    <hr class="logo-divider">
    <div id="sidebar-content"></div>
  </div>

  <!-- Formulário em painel lateral (tela cheia no celular) -->
  <div class="rel-detalhe-overlay" id="cad-form-overlay" hidden></div>
  <aside class="rel-detalhe cad-form-painel" id="cad-form-painel" hidden aria-label="Formulário de cadastro">
    <div class="rel-detalhe-cabecalho">
      <strong id="cad-form-titulo">Novo registro</strong>
      <button type="button" class="rel-filtros-fechar" id="cad-form-fechar" aria-label="Fechar">&times;</button>
    </div>
    <form class="cad-form-corpo" id="cad-form">
      <div id="cad-form-campos"></div>
      <div class="cad-form-meta" id="cad-form-meta" hidden></div>
      <div class="cad-form-acoes">
        <button type="button" class="rel-btn rel-btn-secundario" id="cad-form-cancelar">Cancelar</button>
        <button type="submit" class="rel-btn rel-btn-primario" id="cad-form-salvar">Salvar</button>
      </div>
    </form>
  </aside>

  <script src="../SCRIPT/config.js?v=2"></script>
  <script src="../SCRIPT/geral.js?v=10"></script>
  <script src="../SCRIPT/ajuda/central.js?v=1"></script>
  <script src="../SCRIPT/gestao-nav.js?v=7"></script>
  <script src="../SCRIPT/relatorios/api.js?v=1"></script>
  <script src="../SCRIPT/cadastros/formulario.js?v=2"></script>
  <script src="../SCRIPT/cadastros/catalogos.js?v=2"></script>
  <script src="../SCRIPT/cadastros/equipamentos.js?v=3"></script>
  <script src="../SCRIPT/cadastros/locais.js?v=3"></script>
  <script src="../SCRIPT/contexto/painel.js?v=1"></script>
  <script src="../SCRIPT/contexto/cadastros.js?v=3"></script>

  <div id="info-modal" class="modal" style="display: none;">
    <div class="modal-content">
      <p>Versão de desenvolvimento: 1.0.0</p>
      <button id="modal-ok-btn">OK</button>
    </div>
  </div>
</body>
</html>
