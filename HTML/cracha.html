<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>KERNEL | Verificação de crachá</title>
  <link rel="icon" href="../IMG/Icone.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --escuro: #1F2D3D; --bronze: #A8864F; --texto: #1F2D3D; --suave: #64748b; --fundo: #eef1f4; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; padding: 24px 16px; background: var(--fundo); font-family: Inter, system-ui, sans-serif; color: var(--texto); }
    .cartao { width: 100%; max-width: 380px; overflow: hidden; border-radius: 16px; background: #fff; box-shadow: 0 12px 32px rgba(0,0,0,.12); }
    .topo { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 22px 16px 46px; background: var(--escuro); }
    .topo img { height: 26px; }
    .topo span { font-size: 10.5px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--bronze); }
    .identidade { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; margin-top: -40px; padding: 0 18px; text-align: center; }
    .foto { width: 96px; height: 112px; object-fit: cover; border-radius: 12px; border: 4px solid #fff; background: #535358; box-shadow: 0 4px 14px rgba(0,0,0,.18); }
    h1 { margin: 12px 0 2px; font-size: 21px; }
    .cargo { font-size: 13px; font-weight: 600; color: var(--bronze); }
    .ficha { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 18px; padding-top: 14px; border-top: 1px dashed #d5dbe3; }
    .ficha dt { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #94a3b8; }
    .ficha dd { margin: 2px 0 0; font-size: 14px; font-weight: 600; }
    .sangue { display: inline-block; min-width: 38px; padding: 2px 8px; border-radius: 6px; background: #c62828; color: #fff; font-weight: 800; text-align: center; }
    .sangue.vazio { background: #e5e7eb; color: var(--suave); font-weight: 600; }
    .caps { margin: 0 18px 18px; }
    .caps h2 { margin: 0 0 8px; font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: #94a3b8; }
    .caps ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .caps li { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 14px; }
    .caps small { flex-basis: 100%; font-size: 12px; color: #94a3b8; }
    .selo { padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; }
    .valida { background: #e3f4ea; color: #1a7f45; }
    .vencendo { background: #fff4de; color: #a35d00; }
    .vencida { background: #fde8e8; color: #c62828; }
    .sem_validade { background: #eef1f4; color: var(--suave); }
    .pendencia { margin-bottom: 8px; padding: 9px 11px; border-radius: 8px; background: #fde8e8; color: #c62828; font-size: 13px; font-weight: 700; }
    .ok { margin-bottom: 8px; padding: 9px 11px; border-radius: 8px; background: #e3f4ea; color: #1a7f45; font-size: 13px; font-weight: 700; }
    .rodape { padding: 12px 18px; background: #f8fafc; font-size: 12px; color: var(--suave); text-align: center; }
    .aviso { padding: 40px 20px; text-align: center; color: var(--suave); }
  </style>
</head>
<body>
  <main class="cartao" id="cartao">
    <div class="topo"><img src="../IMG/Logoescura.png" alt="KERNEL"><span>Verificação de crachá</span></div>
    <div class="aviso" id="aviso">Consultando...</div>
  </main>

  <script src="../SCRIPT/config.js?v=2"></script>
  <script>
    (function () {
      const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      const aviso = document.getElementById('aviso');
      const codigo = new URLSearchParams(location.search).get('c') || '';
      if (!codigo) { aviso.textContent = 'Crachá não informado.'; return; }

      fetch((window.apiUrl ? window.apiUrl('/cracha/' + encodeURIComponent(codigo)) : '/cracha/' + codigo))
        .then((r) => r.json())
        .then((d) => {
          if (d.status !== 'ok') throw new Error(d.mensagem || 'Crachá não encontrado.');
          const c = d.cracha;
          const pend = (c.pendencias || []).map((p) => `<div class="pendencia">${esc(p.motivo)}</div>`).join('');
          const caps = (c.capacitacoes || []).map((k) => `<li><strong>${esc(k.nome)}</strong><span class="selo ${esc(k.situacao)}">${esc(k.rotulo)}</span>` +
            `<small>${k.certificado ? 'Certificado ' + esc(k.certificado) + ' · ' : ''}${k.validade ? 'válida até ' + k.validade.split('-').reverse().join('/') : 'sem validade informada'}</small></li>`).join('');
          const situacao = pend || ((c.capacitacoes || []).length ? '<div class="ok">Capacitações exigidas em dia</div>' : '');
          aviso.outerHTML = `
            <div class="identidade">
              <img class="foto" src="${esc(c.foto_url || '../IMG/user-icon.png')}" alt="" onerror="this.onerror=null;this.src='../IMG/user-icon.png'">
              <h1>${esc(c.nome)}</h1>
              ${c.cargo ? `<span class="cargo">${esc(c.cargo)}</span>` : ''}
            </div>
            <dl class="ficha">
              <div><dt>Matrícula</dt><dd>${esc(c.matricula)}</dd></div>
              <div><dt>Tipo sanguíneo</dt><dd><span class="sangue ${c.tipo_sanguineo ? '' : 'vazio'}">${esc(c.tipo_sanguineo || '-')}</span></dd></div>
            </dl>
            <section class="caps">
              <h2>Capacitações</h2>
              ${situacao}
              ${caps ? `<ul>${caps}</ul>` : '<p style="margin:0;color:#94a3b8;font-size:13px">Nenhuma capacitação cadastrada.</p>'}
            </section>
            <div class="rodape">Consultado em ${esc(c.consultado_em)}</div>`;
        })
        .catch((e) => { aviso.textContent = e.message || 'Não foi possível consultar o crachá.'; });
    })();
  </script>
</body>
</html>
